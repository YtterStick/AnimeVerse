      <stop offset="0%" stop-color="#F3E5F5" />
      <stop offset="100%" stop-color="#E1BEE7" />
    </radialGradient>
  </defs>
  <circle cx="60" cy="60" r="56" fill="url(#bg-kiki)" stroke="#CE93D8" stroke-width="3" />

