  <ellipse cx="76" cy="54" rx="8" ry="7" fill="#FFEB3B" stroke="#F57F17" stroke-width="1.5" />
  <ellipse cx="44" cy="54" rx="2.5" ry="6" fill="#212121" />
  <ellipse cx="76" cy="54" rx="2.5" ry="6" fill="#212121" />

  <!-- Big Wide Cheshire Tooth Grin -->
